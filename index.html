<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт товаров</title>
    <style>
        body { 
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: #fff; 
            font-family: sans-serif; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; }

        .top-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats { display: flex; gap: 20px; flex-wrap: wrap; }
        
        .card { 
            background: #1e1e1e; 
            padding: 15px 25px; 
            border-radius: 8px; 
            min-width: 150px; 
            border: 1px solid #2d2d2d;
        }
        .card h3 { margin: 10px 0 0 0; font-size: 24px; }

        .calc-card {
            background: #1e1e1e;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            min-width: 300px;
            flex: 1;
            max-width: 450px;
        }
        .calc-title { font-size: 14px; color: #aaa; margin-bottom: 10px; font-weight: bold; }
        .calc-inputs { display: flex; gap: 8px; align-items: center; }
        .calc-inputs input { width: 80px; }
        .calc-result { margin-top: 10px; font-size: 15px; color: #e74c3c; font-weight: bold; min-height: 18px; }

        .form-group { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 20px; 
            flex-wrap: wrap;
        }
        
        input, select { 
            background: #1e1e1e; 
            border: 1px solid #444; 
            color: #fff; 
            padding: 8px 12px; 
            border-radius: 6px; 
            outline: none;
        }
        input:focus, select:focus { border-color: #2ecc71; }

        button { 
            background: #2ecc71; 
            border: none; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button:hover { background: #27ae60; }

        button.delete-btn { 
            background: rgba(231, 76, 60, 0.1); 
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 4px 10px; 
            font-size: 13px; 
        }
        button.delete-btn:hover { background: #e74c3c; color: white; }

        .table-container {
            background: #1e1e1e;
            border-radius: 8px;
            border: 1px solid #2d2d2d;
            overflow: hidden;
        }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 20px; border-bottom: 1px solid #2d2d2d; }
        th { background: #151515; color: #aaa; font-weight: 600; }
        
        .type-purchase { color: #2ecc71; }
        .type-sale { color: #3498db; }
        
        tr[draggable="true"] { cursor: grab; }
        tr[draggable="true"]:hover { background: #252525; }
        tr.dragging { opacity: 0.3; background: #333 !important; }
    </style>
</head>
<body>

    <h2>Учёт товаров</h2>

    <div class="top-container">
        <div class="stats">
            <div class="card"><div>Потрачено</div><h3 id="total-spent">0 ₽</h3></div>
            <div class="card"><div>Продано</div><h3 id="total-sold">0 ₽</h3></div>
            <div class="card"><div>Прибыль</div><h3 id="total-profit">0 ₽</h3></div>
        </div>

        <!-- Калькулятор процентов -->
        <div class="calc-card">
            <div class="calc-title">Калькулятор % (Скидка)</div>
            <div class="calc-inputs">
                <input type="number" id="calcPrice" placeholder="Цена" oninput="calculatePercent()">
                <span>-</span>
                <input type="number" id="calcPercent" placeholder="%" oninput="calculatePercent()">
                <span>%</span>
            </div>
            <div class="calc-result" id="calcResult">Итог: 0 ₽</div>
        </div>
    </div>

    <div class="form-group">
        <input type="text" id="itemName" placeholder="Название товара">
        <input type="number" id="itemPrice" placeholder="Цена (₽)">
        <select id="itemType">
            <option value="Покупка">Покупка</option>
            <option value="Продажа">Продажа</option>
        </select>
        <button onclick="addItem()">Добавить</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Товар</th>
                    <th>Тип</th>
                    <th>Время</th>
                    <th>Сумма</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Строки добавляются через JS -->
            </tbody>
        </table>
    </div>

    <script>
        let items = [];

        // Исправленная математика: строгое вычитание процента
        function calculatePercent() {
            const price = parseFloat(document.getElementById('calcPrice').value) || 0;
            const percent = parseFloat(document.getElementById('calcPercent').value) || 0;
            
            if (price > 0) {
                // Всегда берем процент как положительное число для вычитания
                const absolutePercent = Math.abs(percent);
                const discount = (price * absolutePercent) / 100;
                const total = price - discount;
                
                document.getElementById('calcResult').style.color = '#e74c3c'; // Красный цвет текста для скидки
                document.getElementById('calcResult').innerText = `Итог: ${total.toLocaleString('ru-RU')} ₽ (скидка: -${discount.toLocaleString('ru-RU')} ₽)`;
            } else {
                document.getElementById('calcResult').innerText = 'Итог: 0 ₽';
            }
        }

        function render() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            let spent = 0;
            let sold = 0;

            items.forEach((item, index) => {
                if (item.type === 'Покупка') {
                    spent += item.price;
                } else {
                    sold += item.price;
                }

                tableBody.innerHTML += `
                    <tr draggable="true" data-index="${index}">
                        <td>${item.name}</td>
                        <td class="${item.type === 'Покупка' ? 'type-purchase' : 'type-sale'}">${item.type}</td>
                        <td style="color: #888; font-size: 14px;">${item.time}</td>
                        <td>${item.price.toLocaleString('ru-RU')} ₽</td>
                        <td>
                            <button class="delete-btn" onclick="deleteItem(${item.id})">Удалить</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('total-spent').innerText = `${spent.toLocaleString('ru-RU')} ₽`;
            document.getElementById('total-sold').innerText = `${sold.toLocaleString('ru-RU')} ₽`;
            
            const profit = sold - spent;
            document.getElementById('total-profit').innerText = `${profit.toLocaleString('ru-RU')} ₽`;

            initDragAndDrop();
        }

        function addItem() {
            const nameInput = document.getElementById('itemName');
            const priceInput = document.getElementById('itemPrice');
            const typeSelect = document.getElementById('itemType');

            if (!nameInput.value || !priceInput.value) {
                alert('Заполните все поля!');
                return;
            }

            const now = new Date();
            const timeString = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const newItem = {
                id: Date.now(), 
                name: nameInput.value,
                price: parseFloat(priceInput.value),
                type: typeSelect.value,
                time: timeString
            };

            items.push(newItem);
            render();

            nameInput.value = '';
            priceInput.value = '';
        }

        window.deleteItem = function(id) {
            items = items.filter(item => item.id !== id);
            render();
        }

        function initDragAndDrop() {
            const rows = document.querySelectorAll('#table-body tr');
            let dragSrcIndex = null;

            rows.forEach(row => {
                row.addEventListener('dragstart', function() {
                    dragSrcIndex = this.getAttribute('data-index');
                    this.classList.add('dragging');
                });

                row.addEventListener('dragover', function(e) {
                    e.preventDefault();
                });

                row.addEventListener('drop', function(e) {
                    e.preventDefault();
                    const targetIndex = this.getAttribute('data-index');
                    
                    if (dragSrcIndex !== null && dragSrcIndex !== targetIndex) {
                        const draggedItem = items[dragSrcIndex];
                        items.splice(dragSrcIndex, 1);
                        items.splice(targetIndex, 0, draggedItem);
                        render();
                    }
                });

                row.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                });
            });
        }
    </script>
</body>
</html>
